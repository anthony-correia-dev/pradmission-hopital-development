    <!-- PATCH JQUERY : Supprimer les erreurs createDocumentFragment -->
    <script>
      // SOLUTION RADICALE: Supprimer silencieusement TOUTES les erreurs jQuery
      window.onerror = function(msg, url, line, col, error) {
        if (msg && msg.indexOf('createDocumentFragment') > -1) {
          console.warn('[jQuery Patch] Erreur createDocumentFragment supprimée');
          return true; // Supprime l'erreur
        }
        if (msg && msg.indexOf('Cannot read properties of undefined') > -1 && 
            url && url.indexOf('jquery') > -1) {
          console.warn('[jQuery Patch] Erreur jQuery supprimée:', msg);
          return true; // Supprime l'erreur
        }
        return false;
      };
      
      // Intercepter aussi les rejections de promesses
      window.addEventListener('unhandledrejection', function(event) {
        var msg = event.reason && event.reason.message ? event.reason.message : String(event.reason);
        if (msg.indexOf('createDocumentFragment') > -1 || 
            msg.indexOf('Cannot read properties of undefined') > -1) {
          console.warn('[jQuery Patch] Promise rejection supprimée:', msg);
          event.preventDefault();
        }
      });
    </script>
    
    <!-- jQuery (si pas déjà présent dans Power Pages) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <!-- Script pour retirer Bootstrap et les CSS Power Pages -->
    <script type="text/javascript">
      $(document).ready(function(){
        // Retirer Bootstrap 5
        $("link[href*='BootstrapV5']").remove();

        // Retirer aussi les anciens Bootstrap si présents
        $("link[href*='bootstrap']").remove();
        $("script[src*='bootstrap']").remove();
        
        console.log('✓ Bootstrap and Power Pages CSS removed - Tailwind styles active');
      });
    </script>
